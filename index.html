<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#2f6fed;--bd:#e2e5ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#e8ebf2;--mu:#98a0b3;--ac:#6b9bff;--bd:#2d3342;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#e8ebf2;--mu:#98a0b3;--ac:#6b9bff;--bd:#2d3342;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:100px}
main{padding:14px;max-width:560px;margin:auto}h2{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.row button{width:auto;padding:2px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;border-radius:0;background:none;font-size:14px;padding:18px 0;min-height:60px}nav button.on{color:var(--ac);font-weight:700}
textarea{min-height:80px}.big{padding:16px 6px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
.seg{display:flex;gap:6px}.seg label{flex:1;margin:0;font-size:inherit;color:inherit}.seg input{position:absolute;opacity:0;width:0;height:0}.seg span{display:block;text-align:center;padding:10px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;cursor:pointer}.seg input:checked+span{background:var(--ac);color:#fff;border-color:var(--ac)}.seg label{position:relative}
.fc{font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:4px;padding:0 3px;margin-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:3px 0;min-height:66px;font-size:12px}.cal button.sel{border:2px solid var(--ac)}.cal button.td span:first-child{color:var(--ac);font-weight:700}

<script>
const $=s=>document.querySelector(s);
const mem={daily:{},events:[],weather:{},settings:{meds:[]}};let db=null,tab='home',D=null,sheet=null,wxMsg='';
const kv=(k,v)=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv',v===undefined?'readonly':'readwrite'),s=t.objectStore('kv'),q=v===undefined?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const save=k=>kv(k,mem[k]);
const ld=()=>new Promise(r=>{try{const q=indexedDB.open('health',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const pad=n=>String(n).padStart(2,'0'),dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date()),nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDay=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return dstr(d)};
const m=t=>t?(+t.slice(0,2))*60+(+t.slice(3,5)):null;
const sleepH=x=>x&&x.sleepAt&&x.wakeAt?((m(x.wakeAt)-m(x.sleepAt)+1440)%1440)/60:null;
const T={sleepy:{n:'眠気',f:[['level','レベル(1弱〜5強)','s5']]},headache:{n:'頭痛',f:[['level','程度(0〜5)','h6'],['dur','持続時間(分)','n',0,1440,1]]},med:{n:'服薬',f:[['name','薬','med']]},exercise:{n:'運動',f:[['name','種目','t'],['min','時間(分)','n',0,600,1]]},nap:{n:'昼寝',f:[['min','時間(分)','n',0,300,1]]},temp:{n:'体温',f:[['val','体温(℃)','n',34,42,0.1]]},weight:{n:'体重',f:[['val','体重(kg)','n',20,300,0.1]]}};
const desc=e=>{const a=e;return e.type==='sleepy'?'レベル'+a.level:e.type==='headache'?'程度'+a.level+(a.dur?' / '+a.dur+'分':''):e.type==='med'?a.name:e.type==='exercise'?(a.name||'')+' '+(a.min||'')+'分':e.type==='nap'?a.min+'分':e.type==='weight'?a.val+'kg':a.val+'℃'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WC=c=>c==null?'':c==0?'快晴':c<=3?'晴れ〜曇り':c<=48?'霧':c<=57?'霧雨':c<=67?'雨':c<=77?'雪':c<=82?'にわか雨':'雷雨';

/* weather */
const pRange=()=>{const a=Object.values(mem.weather).map(w=>w[1]).filter(v=>v!=null);if(!a.length)return[990,1010];let lo=Math.floor(Math.min(...a)/5)*5,hi=Math.ceil(Math.max(...a)/5)*5;if(hi-lo<20){lo=Math.floor((hi+lo)/2-10);hi=lo+20}return[lo,hi]};
async function wx(){const s=mem.settings;if(!s.lat){wxMsg='居住市が未設定です';return}
try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=temperature_2m,surface_pressure,weather_code,precipitation_probability&past_days=7&forecast_days=7&timezone=auto`);const j=await r.json(),h=j.hourly;

function pearson(a,b){const n=a.length;if(n<5)return null;const ma=avg(a),mb=avg(b);let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return x&&y?s/Math.sqrt(x*y):null}
function rows(){const ds=[...new Set([...Object.keys(mem.daily),...mem.events.map(e=>e.date)])].sort();
return ds.map(d=>{const x=mem.daily[d]||{},ev=evsOf(d),p=dayP(d),pp=dayP(addDay(d,-1));let c6=null;
for(let h=6;h<24;h++){const a=hrA(d,h),b=hrA(d,h-6);if(a&&b){const v=Math.abs(a[1]-b[1]);if(c6==null||v>c6)c6=v}}
const mx=t=>Math.max(0,...ev.filter(e=>e.type===t).map(e=>e.level||0));
return{d,head:mx('headache'),sleepy:mx('sleepy'),
f:{'平均気圧':avg(p),'気圧の日内幅':p.length?Math.max(...p)-Math.min(...p):null,'前日比(平均気圧)':p.length&&pp.length?avg(p)-avg(pp):null,'6時間変化の最大':c6,'睡眠時間':sleepH(x),'中途覚醒(あり=1)':x.awake===''||x.awake==null?null:+x.awake,'寝起きの気分':x.mood?+x.mood:null,'1日の気分':x.dayMood?+x.dayMood:null,'食欲':x.appetite?+x.appetite:null,'運動(分)':ev.filter(e=>e.type==='exercise').reduce((s,e)=>s+(e.min||0),0),'残業(h)':x.overtime===''||x.overtime==null?null:x.overtime,'昼寝(分)':ev.filter(e=>e.type==='nap').reduce((s,e)=>s+(e.min||0),0)}}})}
let SP='w',MN=10;
const headTh=()=>{const v=+mem.settings.headTh;return v>=1&&v<=5?v:3};
const bkLast=()=>'最終バックアップ: '+(mem.settings.lastBk||'まだ作成していません');
const md=d=>(+d.slice(5,7))+'/'+(+d.slice(8));
const wAvg=d=>avg(evsOf(d).filter(e=>e.type==='weight'&&e.val!=null).map(e=>e.val));
const AW=['何となく目が覚めた','環境要因(寒暑)','尿意','その他'];
const whyS=x=>x.why&&x.why.length?'('+x.why.join('・')+(x.whyNote?':'+esc(x.whyNote):'')+')':'';
const whyTog=()=>{$('#d_whyNote').style.display=[...document.querySelectorAll('.d_why:checked')].some(i=>i.value==='その他')?'block':'none'};
const whyBlock=x=>`<div id="d_why" style="display:${x.awake==='1'?'block':'none'}"><label>目が覚めた理由(複数選べます)</label>${AW.map(w=>`<label style="display:flex;gap:8px;align-items:center;font-size:15px;color:var(--tx);margin:4px 0"><input type="checkbox" class="d_why" value="${w}" style="width:auto" ${(x.why||[]).includes(w)?'checked':''} onchange="whyTog()">${w}</label>`).join('')}<input id="d_whyNote" placeholder="その他のひとこと" value="${esc(x.whyNote||'')}" style="display:${(x.why||[]).includes('その他')?'block':'none'}"></div>`;
function bins(){const t=today(),n=SP==='y'?52:SP==='m'?30:7;return Array.from({length:n},(_,k)=>{const i=n-1-k,ds=SP==='y'?Array.from({length:7},(_,j)=>addDay(t,-i*7-j)):[addDay(t,-i)];return{ds,l:md(ds[ds.length-1])}})}
const bv=(B,f)=>B.map(b=>avg(b.ds.map(f).filter(v=>v!=null)));
const bedM=x=>x&&x.sleepAt?(m(x.sleepAt)<720?m(x.sleepAt)+1440:m(x.sleepAt)):null,wakeM=x=>x&&x.wakeAt?m(x.wakeAt)+1440:null;
function chart(B,S,lo,hi,tk,fm,bar){const W=340,H=135,L=34,R=6,T=8,Bt=20,n=B.length,pw=(W-L-R)/n,X=i=>L+(i+.5)*pw,Y=v=>T+(hi-Math.min(hi,Math.max(lo,v)))/(hi-lo)*(H-T-Bt),st=n<=7?1:n<=30?5:13;
let g=tk.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-4}" y="${Y(v)+3}" font-size="10" fill="var(--mu)" text-anchor="end">${fm(v)}</text>`).join('');
g+=B.map((b,i)=>(n-1-i)%st?'':`<text x="${X(i)}" y="${H-5}" font-size="10" fill="var(--mu)" text-anchor="middle">${b.l}</text>`).join('');
S.forEach(([vs,c])=>{if(bar){const w=Math.max(1.5,pw*.7);g+=vs.map((v,i)=>v==null?'':`<rect x="${X(i)-w/2}" y="${Y(v)}" width="${w}" height="${Y(lo)-Y(v)}" fill="${c}" rx="1"/>`).join('')}else{g+=`<path fill="none" stroke="${c}" stroke-width="2" d="${vs.map((v,i)=>v==null?'':(i&&vs[i-1]!=null?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)).join('')}"/>`+vs.map((v,i)=>v==null?'':`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2" fill="${c}"/>`).join('')}});
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">${g}</svg>`}
function trendHtml(){const B=bins(),sh=bv(B,d=>sleepH(mem.daily[d])),bd=bv(B,d=>bedM(mem.daily[d])),wk=bv(B,d=>wakeM(mem.daily[d])),wt=bv(B,wAvg);
const all=mem.events.filter(e=>e.type==='weight'&&e.val!=null).map(e=>e.val);let wlo=0,whi=4;if(all.length){wlo=Math.floor(Math.min(...all)-1);whi=Math.ceil(Math.max(...all)+1);if(whi-wlo<4)whi=wlo+4}
const tm=v=>pad(Math.floor(v/60)%24)+'時',card=(t,s,c)=>`<div class="card"><b>${t}</b>${c}${s?`<div class="mu">${s}</div>`:''}</div>`;
return `<h2>トレンド</h2><div class="g3">${[['w','週'],['m','月'],['y','年']].map(([k,l])=>`<button class="${SP===k?'p':''}" onclick="SP='${k}';draw()">${l}</button>`).join('')}</div><div class="mu" style="margin:6px 0">${SP==='w'?'直近7日':SP==='m'?'直近30日':'直近52週(1週間ごとの平均)'}</div>`
+card('睡眠時間(h)','',chart(B,[[sh,'var(--ac)']],0,12,[0,3,6,9,12],v=>v,1))
+card('入眠・起床時刻','<span style="color:var(--ac)">●</span> 入眠　<span style="color:#e8590c">●</span> 起床(縦軸は20時〜翌12時で固定)',chart(B,[[bd,'var(--ac)'],[wk,'#e8590c']],1200,2160,[1200,1440,1680,1920,2160],tm,0))
+card('体重(kg)','',all.length?chart(B,[[wt,'var(--ac)']],wlo,whi,[wlo,(wlo+whi)/2,whi],v=>+v.toFixed(1),0):'<div class="mu">体重の記録がありません</div>')}
function ana(){const R=rows(),ht=headTh(),ML=R.filter(r=>r.head>=ht&&mem.daily[r.d]?.memo).sort((a,b)=>b.head-a.head||(a.d<b.d?1:-1)),keys=Object.keys(R[0]?.f||{});
const cell=(t,k)=>{const pr=R.filter(r=>r.f[k]!=null);const r=pearson(pr.map(q=>q.f[k]),pr.map(q=>q[t]));return r==null?'<td class="mu">-</td>':`<td style="font-weight:${Math.abs(r)>=.4?700:400}">${r.toFixed(2)}</td>`};
return trendHtml()+`<h2>相関分析</h2><div class="card"><div class="mu">対象日数: ${R.length}日。値は相関係数(−1〜1)、太字は絶対値0.4以上。5日分以上で表示、傾向の判断は30日分ほど溜まってからが目安です。相関は原因を示すものではありません。</div>
<table><tr><th>項目</th><th>頭痛</th><th>眠気</th></tr>${keys.map(k=>`<tr><td>${k}</td>${cell('head',k)}${cell('sleepy',k)}</tr>`).join('')}</table></div>
<div class="card"><b>頭痛が強かった日(程度${ht}以上)のメモ</b>${ML.slice(0,MN).map(r=>`<div class="row"><span>${r.d}(程度${r.head}) ${esc(mem.daily[r.d].memo)}</span></div>`).join('')||'<div class="mu">該当なし</div>'}${ML.length>MN?`<button style="margin-top:8px" onclick="MN+=10;draw()">もっと見る(残り${ML.length-MN}件)</button>`:''}</div>`}
function set(){const s=mem.settings;return `<h2>設定</h2><div class="card"><label>居住市(例: 横浜)</label><input id="s_city" value="${esc(s.city||'')}"><label>よく飲む薬(1行に1つ)</label><textarea id="s_meds">${esc(s.meds.join('\n'))}</textarea>
<label>気圧警告の基準(上昇・下降のhPa)</label><div class="g"><div><label>注意: 3時間で</label><input type="number" inputmode="decimal" id="s_th3" step="0.5" min="0.5" value="${thr()[0]}"></div><div><label>警告: 6時間で</label><input type="number" inputmode="decimal" id="s_th6" step="0.5" min="0.5" value="${thr()[1]}"></div></div><label>分析:頭痛メモの対象(程度がこれ以上の日)</label><select id="s_ht">${[1,2,3,4,5].map(n=>`<option ${n===headTh()?'selected':''}>${n}</option>`).join('')}</select><button class="p" style="margin-top:10px" onclick="saveSet()">保存して気象データを更新</button><div class="mu" id="s_msg">${esc(wxMsg||(s.city?'設定中: '+s.city:''))}</div></div>
<div class="card"><b>バックアップと復元</b><div class="mu">全データ(記録・気象・設定)を1つのCSVに書き出し、あとで読み込んで復元できます。</div><div class="mu" id="bk_last" style="margin-top:8px">${bkLast()}</div><button class="p" style="margin-top:8px" onclick="dl()">バックアップCSVを保存</button><label>復元するCSVファイル</label><input type="file" accept=".csv,text/csv,text/plain" onchange="pick(this)"><label>または、CSVの内容を貼り付け</label><textarea id="rsbox" style="min-height:70px"></textarea><button style="margin-top:8px" onclick="rs()">復元(既存データに追加・上書き)</button><div class="mu" id="bk_msg">${esc(bkMsg)}</div></div>
<div class="card"><b>分析用CSV出力</b><div class="g" style="margin-top:8px"><button onclick="csv('d')">日別サマリー</button><button onclick="csv('h')">1時間ごと気象</button></div><textarea id="csvbox" readonly style="margin-top:8px;min-height:120px" placeholder="ここにCSVが表示されます"></textarea><button onclick="cp()">コピー</button></div>
<div class="card"><b>表示</b><div class="g" style="margin-top:8px"><button onclick="document.documentElement.dataset.theme='light'">ライト</button><button onclick="document.documentElement.dataset.theme='dark'">ダーク</button></div></div>`}
async function saveSet(){const s=mem.settings,c=$('#s_city').value.trim();const a3=parseFloat($('#s_th3').value),a6=parseFloat($('#s_th6').value);if(a3>0)s.th3=a3;{const ht=parseInt($('#s_ht').value);if(ht>=1&&ht<=5)s.headTh=ht}if(a6>0)s.th6=a6;s.meds=$('#s_meds').value.split('\n').map(x=>x.trim()).filter(Boolean);
if(c&&c!==s.city){try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(c)+'&count=1&language=ja'),j=await r.json();if(j.results&&j.results[0]){s.city=c;s.lat=j.results[0].latitude;s.lon=j.results[0].longitude}else{wxMsg='市が見つかりませんでした'}}catch(e){s.city=c;wxMsg='市の座標を取得できませんでした(通信できない環境の可能性があります)'}}
await save('settings');if(s.lat)await wx();draw()}
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function csv(t){let o;if(t==='h'){o=[['日時','気温','気圧','天気']].concat(Object.keys(mem.weather).sort().filter(k=>!isFc(k)).map(k=>[k,...mem.weather[k].slice(0,2),WC(mem.weather[k][2])]))}
else{o=[['日付','入眠','起床','睡眠時間h','中途覚醒','中途覚醒理由','寝起き気分','入浴','夕食','残業h','1日の気分','食欲','頭痛最大','眠気最大','運動分','昼寝分','体温','体重kg','気温0時','気温6時','気温12時','気温18時','気圧0時','気圧6時','気圧12時','気圧18時','気圧最高','気圧最低','天気12時','随時記録','メモ']];
rows().forEach(r=>{const x=mem.daily[r.d]||{},ev=evsOf(r.d),p=dayP(r.d),w=h=>hrA(r.d,h);
o.push([r.d,x.sleepAt,x.wakeAt,sleepH(x)?.toFixed(2),x.awake==='1'?'あり':x.awake==='0'?'なし':'',(x.why||[]).join('・')+(x.whyNote?':'+x.whyNote:''),x.mood,x.bath,x.dinner,x.overtime,x.dayMood,x.appetite,r.head,r.sleepy,r.f['運動(分)'],r.f['昼寝(分)'],ev.filter(e=>e.type==='temp').map(e=>e.time+' '+e.val).join(' / '),wAvg(r.d)?.toFixed(1),...[0,6,12,18].map(h=>w(h)?.[0]),...[0,6,12,18].map(h=>w(h)?.[1]),p.length?Math.max(...p):'',p.length?Math.min(...p):'',w(12)?WC(w(12)[2]):'',ev.map(e=>e.time+' '+T[e.type].n+' '+desc(e)).join(' / '),x.memo])})}
$('#csvbox').value=o.map(r=>r.map(q).join(',')).join('\n')}
function bk(){const s=mem.settings,o=[['kind','f1','f2','f3','f4','f5','f6','f7','f8','f9','f10','f11','f12','f13'],['setting',s.city||'',s.lat??'',s.lon??'',(s.meds||[]).join('|'),'2',s.th3??'',s.th6??'',s.headTh??'',s.lastBk||'']];
Object.keys(mem.daily).sort().forEach(d=>{const x=mem.daily[d];o.push(['daily',d,x.sleepAt,x.wakeAt,x.awake,x.mood,x.bath,x.dinner,x.overtime,x.memo,x.dayMood,x.appetite,(x.why||[]).join('|'),x.whyNote])});
mem.events.forEach(e=>o.push(['event',e.id,e.date,e.time,e.type,e.level,e.dur,e.name,e.min,e.val]));
Object.keys(mem.weather).sort().filter(k=>!isFc(k)).forEach(k=>o.push(['weather',k,...mem.weather[k].slice(0,3)]));
return o.map(r=>r.map(q).join(',')).join('\n')}
function dl(){mem.settings.lastBk=today()+' '+nowT();save('settings');$('#bk_last').textContent=bkLast();const t=bk();$('#csvbox').value=t;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='health-backup-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove()}catch(e){}

function parseCSV(t){t=t.replace(/^\ufeff/,'');const R=[];let r=[],c='',iq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(iq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else iq=false}else c+=ch}else if(ch=='"')iq=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
if(c!==''||r.length){r.push(c);R.push(r)}return R}
const nv=v=>v===''||v==null?null:+v;
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rsbox').value=r.result;$('#bk_msg').textContent='読み込みました。「復元」をタップしてください'};r.readAsText(f)}
async function rs(){const R=parseCSV($('#rsbox').value),n={daily:0,event:0,weather:0},s=mem.settings,ids=new Set(mem.events.map(e=>String(e.id)));
if(!R.some(r=>['daily','event','weather','setting'].includes(r[0]))){$('#bk_msg').textContent='復元できるデータが見つかりません(バックアップCSVを指定してください)';return}
const sr=R.find(r=>r[0]==='setting'),legacy=!sr||sr[5]!=='2',cv=v=>legacy&&v!=null?Math.ceil(v/2):v;
R.forEach(r=>{const k=r[0];
if(k==='setting'){if(r[1])s.city=r[1];if(r[2]!=='')s.lat=+r[2];if(r[3]!=='')s.lon=+r[3];if(r[4])s.meds=r[4].split('|').filter(Boolean);if(r[6]!==''&&r[6]!=null)s.th3=+r[6];if(r[7]!==''&&r[7]!=null)s.th6=+r[7];if(r[8])s.headTh=+r[8];if(r[9]&&r[9]>(s.lastBk||''))s.lastBk=r[9]}
else if(k==='daily'&&r[1]){mem.daily[r[1]]={sleepAt:r[2],wakeAt:r[3],awake:r[4],mood:r[5],bath:r[6],dinner:r[7],overtime:nv(r[8]),memo:r[9],dayMood:r[10]||'',appetite:r[11]||'',why:(r[12]||'').split('|').filter(Boolean),whyNote:r[13]||''};n.daily++}
else if(k==='event'&&r[1]&&!ids.has(r[1])){mem.events.push({id:+r[1],date:r[2],time:r[3],type:r[4],level:r[4]==='headache'?cv(nv(r[5])):nv(r[5]),dur:nv(r[6]),name:r[7],min:nv(r[8]),val:nv(r[9])});ids.add(r[1]);n.event++}
else if(k==='weather'&&(r[1]||'').includes('T')){mem.weather[r[1]]=[nv(r[2]),nv(r[3]),nv(r[4])];n.weather++}});
for(const k of ['daily','events','weather','settings'])await save(k);
bkMsg=`復元しました(日別${n.daily}件、随時記録${n.event}件、気象${n.weather}件)`;draw()}
async function cp(){const b=$('#csvbox');b.select();try{await navigator.clipboard.writeText(b.value)}catch(e){document.execCommand('copy')}}
(async()=>{await ld();for(const k of Object.keys(mem)){const v=await kv(k);if(v)mem[k]=v}mem.settings.meds=mem.settings.meds||[];if(db&&!(await kv('hv5'))){mem.events.forEach(e=>{if(e.type==='headache'&&e.level!=null)e.level=Math.ceil(e.level/2)});await save('events');await kv('hv5',1)}draw();if(mem.settings.lat){await wx();if(tab==='set')draw()}})();
