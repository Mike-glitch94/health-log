<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>体調管理</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mu:#6b7385;--ac:#2f6fed;--bd:#e2e5ec;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1c212c;--tx:#e8ebf2;--mu:#98a0b3;--ac:#6b9bff;--bd:#2d3342;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1c212c;--tx:#e8ebf2;--mu:#98a0b3;--ac:#6b9bff;--bd:#2d3342;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding-bottom:100px}
main{padding:14px;max-width:560px;margin:auto}h2{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
button{cursor:pointer;background:var(--card)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mu{color:var(--mu);font-size:13px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.row button{width:auto;padding:2px 10px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;border-radius:0;background:none;font-size:14px;padding:18px 0;min-height:60px}nav button.on{color:var(--ac);font-weight:700}
textarea{min-height:80px}.big{padding:16px 6px;font-size:15px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px;border-bottom:1px solid var(--bd);text-align:right}td:first-child,th:first-child{text-align:left}
.seg{display:flex;gap:6px}.seg label{flex:1;margin:0;font-size:inherit;color:inherit}.seg input{position:absolute;opacity:0;width:0;height:0}.seg span{display:block;text-align:center;padding:10px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:15px;cursor:pointer}.seg input:checked+span{background:var(--ac);color:#fff;border-color:var(--ac)}.seg label{position:relative}
</style></head><body><main id="v"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s);
const mem={daily:{},events:[],weather:{},settings:{meds:[]}};let db=null,tab='home',D=null,sheet=null,wxMsg='';
const kv=(k,v)=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('kv',v===undefined?'readonly':'readwrite'),s=t.objectStore('kv'),q=v===undefined?s.get(k):s.put(v,k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()}catch(e){r()}});
const save=k=>kv(k,mem[k]);
const ld=()=>new Promise(r=>{try{const q=indexedDB.open('health',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const pad=n=>String(n).padStart(2,'0'),dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date()),nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDay=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return dstr(d)};
const m=t=>t?(+t.slice(0,2))*60+(+t.slice(3,5)):null;
const sleepH=x=>x&&x.sleepAt&&x.wakeAt?((m(x.wakeAt)-m(x.sleepAt)+1440)%1440)/60:null;
const T={sleepy:{n:'眠気',f:[['level','レベル(1弱〜5強)','s5']]},headache:{n:'頭痛',f:[['level','程度(0〜5)','h6'],['dur','持続時間(分)','n',0,1440,1]]},med:{n:'服薬',f:[['name','薬','med']]},exercise:{n:'運動',f:[['name','種目','t'],['min','時間(分)','n',0,600,1]]},nap:{n:'昼寝',f:[['min','時間(分)','n',0,300,1]]},temp:{n:'体温',f:[['val','体温(℃)','n',34,42,0.1]]}};
const desc=e=>{const a=e;return e.type==='sleepy'?'レベル'+a.level:e.type==='headache'?'程度'+a.level+(a.dur?' / '+a.dur+'分':''):e.type==='med'?a.name:e.type==='exercise'?(a.name||'')+' '+(a.min||'')+'分':e.type==='nap'?a.min+'分':a.val+'℃'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WC=c=>c==null?'':c==0?'快晴':c<=3?'晴れ〜曇り':c<=48?'霧':c<=57?'霧雨':c<=67?'雨':c<=77?'雪':c<=82?'にわか雨':'雷雨';

/* weather */
async function wx(){const s=mem.settings;if(!s.lat){wxMsg='居住市が未設定です';return}
try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${s.lat}&longitude=${s.lon}&hourly=temperature_2m,surface_pressure,weather_code&past_days=7&forecast_days=1&timezone=auto`);const j=await r.json(),h=j.hourly;
h.time.forEach((t,i)=>{if(h.surface_pressure[i]!=null)mem.weather[t]=[h.temperature_2m[i],h.surface_pressure[i],h.weather_code[i]]});await save('weather');wxMsg='気象データを更新しました('+h.time.length+'件)'}catch(e){wxMsg='気象データを取得できませんでした(通信できない環境の可能性があります)'}}
const hr=(d,h)=>mem.weather[d+'T'+pad(h)+':00'];
const dayP=d=>{const a=[];for(let h=0;h<24;h++){const w=hr(d,h);if(w)a.push(w[1])}return a};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;

/* views */
function nav(){$('#nav').innerHTML=[['home','ホーム'],['am','朝'],['hist','履歴'],['wx','気象'],['ana','分析'],['set','設定']].map(([k,l])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}</button>`).join('')}
function go(k){tab=k;sheet=null;draw()}
function draw(){nav();const f={home,am:daily,hist,wx:wview,ana,set}[tab];$('#v').innerHTML=f();window.scrollTo(0,0)}
const evsOf=d=>mem.events.filter(e=>e.date===d).sort((a,b)=>a.time<b.time?-1:1);
function home(){const d=today(),nt=isNight();
let h=`<h2>${d} の記録</h2>${nt?dayCard(true):''}<div class="g3">${Object.keys(T).map(k=>`<button class="big" onclick="openSheet('${k}')">${T[k].n}</button>`).join('')}</div>`;
if(sheet)h+=form(sheet);
h+=`<div class="card" style="margin-top:12px"><b>今日の随時記録</b>`+(evsOf(d).map(e=>`<div class="row"><span>${e.time} ${T[e.type].n} ${esc(desc(e))}</span><button onclick="delEv(${e.id})">削除</button></div>`).join('')||'<div class="mu">まだありません</div>')+'</div>'+(nt?'':dayCard(false));return h}
function openSheet(k){sheet=k;draw()}
function form(k){const t=T[k];return `<div class="card" style="margin-top:12px"><b>${t.n}を記録</b><div class="g"><div><label>日付</label><input type="date" id="f_date" value="${today()}"></div><div><label>${k==='headache'?'開始時刻':'時刻'}</label><input type="time" id="f_time" value="${nowT()}"></div></div>`+t.f.map(([id,l,ty,mn,mx,st])=>{let i;
if(ty==='s5')i=seg('f_'+id,1,5,1);
else if(ty==='h6')i=seg('f_'+id,0,5,null)+'<div class="mu">0=痛くない(予防の服薬など) 1=ごく軽い 3=普通に支障あり 5=動けない(2・4は中間)</div>';
else if(ty==='med')i=mem.settings.meds.length?`<select id="f_${id}">${mem.settings.meds.map(n=>`<option>${esc(n)}</option>`).join('')}</select>`:`<input id="f_${id}" placeholder="設定で薬を登録できます">`;
else if(ty==='n')i=`<input type="number" inputmode="decimal" id="f_${id}" min="${mn}" max="${mx}" step="${st}">`;else i=`<input id="f_${id}">`;
return `<label>${l}</label>`+i}).join('')+`<div class="g" style="margin-top:12px"><button onclick="sheet=null;draw()">閉じる</button><button class="p" onclick="addEv('${k}')">保存</button></div><div class="mu" id="f_msg"></div></div>`}
async function addEv(k){const e={id:Date.now(),type:k,date:$('#f_date').value,time:$('#f_time').value};
T[k].f.forEach(([id,,ty])=>{if(ty==='s5'||ty==='h6'){const v=segv('f_'+id);e[id]=v===''?null:+v;return}const v=$('#f_'+id).value;e[id]=ty==='n'?(v===''?null:+v):v});
if(k==='headache'&&e.level==null){$('#f_msg').textContent='頭痛の程度(0〜5)を選んでください';return}
mem.events.push(e);await save('events');sheet=null;draw()}
async function delEv(id){mem.events=mem.events.filter(e=>e.id!==id);await save('events');draw()}
let HD=null;
const isNight=()=>{const h=new Date().getHours();return h>=18||h<4};
const thr=()=>{const s=mem.settings,a=+s.th3,b=+s.th6;return [a>0?a:4,b>0?b:8]};
/* 段階入力の共通部品 */
const seg=(id,lo,hi,val)=>`<div class="seg">${Array.from({length:hi-lo+1},(_,i)=>lo+i).map(n=>`<label><input type="radio" name="seg_${id}" value="${n}" ${val!=null&&val!==''&&+val===n?'checked':''}><span>${n}</span></label>`).join('')}</div>`;
const segv=id=>document.querySelector(`input[name="seg_${id}"]:checked`)?.value??'';
function daily(){D=D||today();const x=mem.daily[D]||{};
const prev=Object.keys(mem.daily).filter(d=>d<D&&mem.daily[d].sleepAt).sort().pop(),p=prev?mem.daily[prev]:{};
const dateSel=`<label>日付(起床日)</label><input type="date" id="d_date" value="${D}" onchange="D=this.value;draw()">`;
const inp=(id,l,t,v,ex='')=>`<label>${l}</label><input type="${t}" id="d_${id}" value="${esc(v??'')}" ${ex}>`;
let h=`<h2>朝の入力(睡眠)</h2><div class="card">${dateSel}`;
h+=`<div class="g"><div>${inp('sleepAt','入眠時刻','time',x.sleepAt??p.sleepAt)}</div><div>${inp('wakeAt','起床時刻','time',x.wakeAt??p.wakeAt)}</div></div>
<label>中途覚醒</label><select id="d_awake"><option value="">未入力</option><option value="0" ${x.awake==='0'?'selected':''}>なし</option><option value="1" ${x.awake==='1'?'selected':''}>あり</option></select>
<label>寝起きの気分(1悪い〜5良い)</label>${seg('d_mood',1,5,x.mood)}`;
return h+`<button class="p" style="margin-top:12px" onclick="saveDaily()">保存</button><div class="mu" id="d_msg"></div></div>`}
async function saveDaily(){const x=mem.daily[D]||(mem.daily[D]={});
['sleepAt','wakeAt','awake'].forEach(id=>{x[id]=$('#d_'+id).value});x.mood=segv('d_mood');
await save('daily');$('#d_msg').textContent='保存しました'}
/* ホームの「1日の振り返り」(旧・夜タブの項目+気分+食欲) */
function dayCard(nt){HD=HD||today();const x=mem.daily[HD]||{};
const bath=x.bath||'',din=x.dinner||'';
return `<div class="card" style="margin-top:12px;${nt?'border:2px solid var(--ac)':''}"><b>${nt?'🌙 今夜の記録(気分・食欲・入浴・夕食)':'気分・食欲・入浴・夕食'}</b>
<label>日付</label><input type="date" id="h_date" value="${HD}" onchange="HD=this.value;draw()">
<label>1日の気分(1悪い〜5良い)</label>${seg('h_dayMood',1,5,x.dayMood)}
<label>食欲(1ほぼ食べられない・3普通・5いつもより多い)</label>${seg('h_appetite',1,5,x.appetite)}
<div class="g"><div><label>入浴時刻</label><input type="time" id="h_bath" value="${esc(bath)}"></div><div><label>夕食時刻</label><input type="time" id="h_dinner" value="${esc(din)}"></div></div>
<label>残業時間(h)</label><input type="number" inputmode="decimal" id="h_overtime" step="0.25" min="0" value="${esc(x.overtime??'')}">
<label>今日のメモ</label><textarea id="h_memo">${esc(x.memo||'')}</textarea>
<button class="p" style="margin-top:12px" onclick="saveHome()">保存</button><div class="mu" id="h_msg"></div></div>`}
async function saveHome(){const x=mem.daily[HD]||(mem.daily[HD]={});
x.dayMood=segv('h_dayMood');x.appetite=segv('h_appetite');x.bath=$('#h_bath').value;x.dinner=$('#h_dinner').value;
const o=$('#h_overtime').value;x.overtime=o===''?null:+o;x.memo=$('#h_memo').value;
await save('daily');$('#h_msg').textContent='保存しました'}
/* グラフ用アイコン */
function face(x,y,l,tt){const r=5+l,c=['#a8e6a1','#ffe066','#ffc94a','#ff9f43','#ff6b4a','#e03131'][l],e=r*.38,ey=y-r*.2,my=y+r*.45,w=r*.45,k='stroke="#3a2a00" stroke-width="1" fill="none" stroke-linecap="round"';
const dots=`<circle cx="${x-e}" cy="${ey}" r="1.1" fill="#3a2a00"/><circle cx="${x+e}" cy="${ey}" r="1.1" fill="#3a2a00"/>`;
const eyes=l<=2?dots:l===3?dots+`<path d="M${x-e-2},${ey-3}L${x-e+1.5},${ey-2}M${x+e+2},${ey-3}L${x+e-1.5},${ey-2}" ${k}/>`:l===4?`<path d="M${x-e-1.5},${ey-1.5}L${x-e+1.5},${ey}L${x-e-1.5},${ey+1.5}M${x+e+1.5},${ey-1.5}L${x+e-1.5},${ey}L${x+e+1.5},${ey+1.5}" ${k}/>`:`<path d="M${x-e-1.5},${ey-1.5}l3,3m0,-3l-3,3M${x+e-1.5},${ey-1.5}l3,3m0,-3l-3,3" ${k}/>`;
const mouth=l===0?`M${x-w},${my-.5}Q${x},${my+3.5} ${x+w},${my-.5}`:l===1?`M${x-w},${my}L${x+w},${my}`:l===5?`M${x-w},${my}L${x-w/2},${my-1.5}L${x},${my+1}L${x+w/2},${my-1.5}L${x+w},${my}`:`M${x-w},${my+l-1}Q${x},${my-l} ${x+w},${my+l-1}`;
return `<g><title>${esc(tt)}</title><circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="#5c4400" stroke-width=".8"/>${eyes}<path d="${mouth}" ${k}/></g>`}
function capsule(x,y,tt){return `<g transform="translate(${x},${y}) rotate(-35)"><title>${esc(tt)}</title><path d="M0,-4H-4A4,4 0 0 0 -4,4H0Z" fill="#2f6fed"/><path d="M0,-4H4A4,4 0 0 1 4,4H0Z" fill="#fff"/><rect x="-8" y="-4" width="16" height="8" rx="4" fill="none" stroke="var(--mu)" stroke-width="1"/></g>`}
/* 気圧の警告帯: 各時刻から過去3h/6hの下降量を評価し、基準超えの区間(窓の全体)を連続帯にする */
function warnBands(d){const [t3,t6]=thr();
const P=(h,o)=>{const t=h+o,w=hr(addDay(d,Math.floor(t/24)),((t%24)+24)%24);return w?w[1]:null};
const cov=new Array(24).fill(0);
for(let h=0;h<24;h++){const c=P(h,0);if(c==null)continue;const a6=P(h,-6),a3=P(h,-3);let lv=0,w=0;
if(a6!=null&&Math.abs(a6-c)>=t6){lv=2;w=6}else if(a3!=null&&Math.abs(a3-c)>=t3){lv=1;w=3}
for(let i=h-w;i<h;i++)if(i>=0)cov[i]=Math.max(cov[i],lv)}
const s=[];for(let i=0;i<24;i++){const lv=cov[i];if(!lv)continue;const l=s[s.length-1];if(l&&l.lv===lv&&l.e===i)l.e=i+1;else s.push({s:i,e:i+1,lv})}
return s}

function hist(){const ds=[...new Set([...Object.keys(mem.daily),...mem.events.map(e=>e.date)])].sort().reverse();
return '<h2>日別の履歴</h2>'+(ds.map(d=>{const x=mem.daily[d]||{},sh=sleepH(x),p=dayP(d);
return `<div class="card"><b>${d}</b><div class="mu">${sh!=null?`睡眠 ${x.sleepAt}→${x.wakeAt}(${sh.toFixed(1)}h) `:''}${x.awake?'中途覚醒'+(x.awake==='1'?'あり':'なし')+' ':''}${x.mood?'寝起き'+x.mood+' ':''}${x.dayMood?'気分'+x.dayMood+' ':''}${x.appetite?'食欲'+x.appetite:''}</div>
<div class="mu">${x.bath?'入浴'+x.bath+' ':''}${x.dinner?'夕食'+x.dinner+' ':''}${x.overtime!=null&&x.overtime!==''?'残業'+x.overtime+'h':''}</div>
${p.length?`<div class="mu">気圧 平均${avg(p).toFixed(0)}hPa(${Math.min(...p).toFixed(0)}〜${Math.max(...p).toFixed(0)}) ${hr(d,12)?WC(hr(d,12)[2]):''}</div>`:''}
${evsOf(d).map(e=>`<div>${e.time} ${T[e.type].n} ${esc(desc(e))}</div>`).join('')}${x.memo?`<div style="margin-top:6px;white-space:pre-wrap">📝 ${esc(x.memo)}</div>`:''}</div>`}).join('')||'<div class="mu">記録がありません</div>')}
let WD=null,bkMsg='';
function wview(){WD=WD||today();const t=[];for(let h=0;h<24;h++){const x=hr(WD,h);if(x)t.push([h,x])}
let o=`<h2>気象の履歴</h2><div class="card"><div style="display:grid;grid-template-columns:56px 1fr 56px;gap:8px"><button onclick="WD=addDay(WD,-1);draw()">◀</button><input type="date" value="${WD}" onchange="WD=this.value;draw()"><button onclick="WD=addDay(WD,1);draw()">▶</button></div></div>`;
if(!t.length){const ks=Object.keys(mem.weather).sort();return o+`<div class="card mu">この日の気象データがありません。${ks.length?'取得済み: '+ks[0].slice(0,10)+' 〜 '+ks[ks.length-1].slice(0,10):'設定画面で居住市を保存すると取得されます。'}</div>`}
const tp=t.map(([h,x])=>x[0]).filter(v=>v!=null),pv=t.map(([h,x])=>x[1]),mn=Math.min(...pv)-1,mx=Math.max(...pv)+1;
const X=h=>40+h*12,Y=v=>10+(mx-v)/(mx-mn)*100,f=(v,d=1)=>v==null?'-':v.toFixed(d);
const segs=warnBands(WD),COL=['','rgba(255,193,7,.30)','rgba(224,49,49,.28)'],NM=['','注意','警告'],[t3,t6]=thr();
const tm=e=>{const a=m(e.time);return a==null?null:a/60};
const evs=evsOf(WD),hd=evs.filter(e=>e.type==='headache'&&e.level!=null),md=evs.filter(e=>e.type==='med'),both=evs.filter(e=>e.type==='headache'||e.type==='med');
const bands=segs.map(s=>`<rect x="${X(s.s)}" y="10" width="${X(s.e)-X(s.s)}" height="100" fill="${COL[s.lv]}"/>`).join('');
const hIc=hd.map(e=>{const h=tm(e);return h==null?'':face(X(h),148,e.level,`${e.time} 頭痛 程度${e.level}`)}).join('');
const mIc=md.map(e=>{const h=tm(e);return h==null?'':capsule(X(h),176,`${e.time} ${e.name||'服薬'}`)}).join('');
const sw=c=>`<span style="display:inline-block;width:12px;height:12px;background:${c};border:1px solid var(--bd);vertical-align:-2px"></span>`;
o+=`<div class="card"><b>0・6・12・18時</b><table><tr><th>時刻</th><th>気温℃</th><th>気圧hPa</th><th>天気</th></tr>${[0,6,12,18].map(h=>{const x=hr(WD,h);return `<tr><td>${h}時</td><td>${x?f(x[0]):'-'}</td><td>${x?f(x[1],0):'-'}</td><td>${x?WC(x[2]):'-'}</td></tr>`}).join('')}</table>
<div class="mu" style="margin-top:6px">気温 最高${f(Math.max(...tp))} / 最低${f(Math.min(...tp))}℃　気圧 最高${f(Math.max(...pv),0)} / 最低${f(Math.min(...pv),0)}hPa</div></div>
<div class="card"><b>気圧の推移(hPa)と頭痛・服薬</b><svg viewBox="0 0 340 196" style="width:100%">${bands}<g stroke="var(--bd)">${[0,6,12,18].map(h=>`<line x1="${X(h)}" x2="${X(h)}" y1="10" y2="110"/>`).join('')}<line x1="40" x2="328" y1="148" y2="148" stroke-dasharray="2 3"/><line x1="40" x2="328" y1="176" y2="176" stroke-dasharray="2 3"/></g><polyline fill="none" stroke="var(--ac)" stroke-width="2" points="${t.map(([h,x])=>X(h).toFixed(1)+','+Y(x[1]).toFixed(1)).join(' ')}"/><g fill="var(--mu)" font-size="11" text-anchor="middle">${[0,6,12,18].map(h=>`<text x="${X(h)}" y="126">${h}時</text>`).join('')}</g><text x="0" y="18" font-size="11" fill="var(--mu)">${mx.toFixed(0)}</text><text x="0" y="112" font-size="11" fill="var(--mu)">${mn.toFixed(0)}</text><text x="0" y="152" font-size="10" fill="var(--mu)">頭痛</text><text x="0" y="180" font-size="10" fill="var(--mu)">服薬</text>${hIc}${mIc}</svg>
<div class="mu">${sw('rgba(255,193,7,.45)')} 注意(3時間で${t3}hPa以上の上昇・下降)　${sw('rgba(224,49,49,.45)')} 警告(6時間で${t6}hPa以上の上昇・下降)</div>
<div style="margin-top:6px">${segs.length?segs.map(s=>`${NM[s.lv]} ${s.s}〜${s.e}時`).join(' / '):'<span class="mu">基準を超える気圧の変化はありません</span>'}</div></div>
<div class="card"><b>この日の頭痛・服薬</b>${both.map(e=>`<div class="row"><span>${e.time} ${T[e.type].n} ${esc(desc(e))}</span></div>`).join('')||'<div class="mu">記録はありません</div>'}</div>
<div class="card"><details><summary>1時間ごとの一覧</summary><table><tr><th>時刻</th><th>気温℃</th><th>気圧hPa</th><th>天気</th></tr>${t.map(([h,x])=>`<tr><td>${h}時</td><td>${f(x[0])}</td><td>${f(x[1],1)}</td><td>${WC(x[2])}</td></tr>`).join('')}</table></details></div>`;return o}

function pearson(a,b){const n=a.length;if(n<5)return null;const ma=avg(a),mb=avg(b);let s=0,x=0,y=0;for(let i=0;i<n;i++){s+=(a[i]-ma)*(b[i]-mb);x+=(a[i]-ma)**2;y+=(b[i]-mb)**2}return x&&y?s/Math.sqrt(x*y):null}
function rows(){const ds=[...new Set([...Object.keys(mem.daily),...mem.events.map(e=>e.date)])].sort();
return ds.map(d=>{const x=mem.daily[d]||{},ev=evsOf(d),p=dayP(d),pp=dayP(addDay(d,-1));let c6=null;
for(let h=6;h<24;h++){const a=hr(d,h),b=hr(d,h-6);if(a&&b){const v=Math.abs(a[1]-b[1]);if(c6==null||v>c6)c6=v}}
const mx=t=>Math.max(0,...ev.filter(e=>e.type===t).map(e=>e.level||0));
return{d,head:mx('headache'),sleepy:mx('sleepy'),
f:{'平均気圧':avg(p),'気圧の日内幅':p.length?Math.max(...p)-Math.min(...p):null,'前日比(平均気圧)':p.length&&pp.length?avg(p)-avg(pp):null,'6時間変化の最大':c6,'睡眠時間':sleepH(x),'中途覚醒(あり=1)':x.awake===''||x.awake==null?null:+x.awake,'寝起きの気分':x.mood?+x.mood:null,'1日の気分':x.dayMood?+x.dayMood:null,'食欲':x.appetite?+x.appetite:null,'運動(分)':ev.filter(e=>e.type==='exercise').reduce((s,e)=>s+(e.min||0),0),'残業(h)':x.overtime===''||x.overtime==null?null:x.overtime,'昼寝(分)':ev.filter(e=>e.type==='nap').reduce((s,e)=>s+(e.min||0),0)}}})}
function ana(){const R=rows(),keys=Object.keys(R[0]?.f||{});
const cell=(t,k)=>{const pr=R.filter(r=>r.f[k]!=null);const r=pearson(pr.map(q=>q.f[k]),pr.map(q=>q[t]));return r==null?'<td class="mu">-</td>':`<td style="font-weight:${Math.abs(r)>=.4?700:400}">${r.toFixed(2)}</td>`};
return `<h2>相関分析</h2><div class="card"><div class="mu">対象日数: ${R.length}日。値は相関係数(−1〜1)、太字は絶対値0.4以上。5日分以上で表示、傾向の判断は30日分ほど溜まってからが目安です。相関は原因を示すものではありません。</div>
<table><tr><th>項目</th><th>頭痛</th><th>眠気</th></tr>${keys.map(k=>`<tr><td>${k}</td>${cell('head',k)}${cell('sleepy',k)}</tr>`).join('')}</table></div>
<div class="card"><b>頭痛が強かった日(程度4以上)のメモ</b>${R.filter(r=>r.head>=4&&mem.daily[r.d]?.memo).sort((a,b)=>b.head-a.head).slice(0,10).map(r=>`<div class="row"><span>${r.d}(程度${r.head}) ${esc(mem.daily[r.d].memo)}</span></div>`).join('')||'<div class="mu">該当なし</div>'}</div>`}
function set(){const s=mem.settings;return `<h2>設定</h2><div class="card"><label>居住市(例: 横浜)</label><input id="s_city" value="${esc(s.city||'')}"><label>よく飲む薬(1行に1つ)</label><textarea id="s_meds">${esc(s.meds.join('\n'))}</textarea>
<label>気圧警告の基準(上昇・下降のhPa)</label><div class="g"><div><label>注意: 3時間で</label><input type="number" inputmode="decimal" id="s_th3" step="0.5" min="0.5" value="${thr()[0]}"></div><div><label>警告: 6時間で</label><input type="number" inputmode="decimal" id="s_th6" step="0.5" min="0.5" value="${thr()[1]}"></div></div><button class="p" style="margin-top:10px" onclick="saveSet()">保存して気象データを更新</button><div class="mu" id="s_msg">${esc(wxMsg||(s.city?'設定中: '+s.city:''))}</div></div>
<div class="card"><b>バックアップと復元</b><div class="mu">全データ(記録・気象・設定)を1つのCSVに書き出し、あとで読み込んで復元できます。</div><button class="p" style="margin-top:8px" onclick="dl()">バックアップCSVを保存</button><label>復元するCSVファイル</label><input type="file" accept=".csv,text/csv,text/plain" onchange="pick(this)"><label>または、CSVの内容を貼り付け</label><textarea id="rsbox" style="min-height:70px"></textarea><button style="margin-top:8px" onclick="rs()">復元(既存データに追加・上書き)</button><div class="mu" id="bk_msg">${esc(bkMsg)}</div></div>
<div class="card"><b>分析用CSV出力</b><div class="g" style="margin-top:8px"><button onclick="csv('d')">日別サマリー</button><button onclick="csv('h')">1時間ごと気象</button></div><textarea id="csvbox" readonly style="margin-top:8px;min-height:120px" placeholder="ここにCSVが表示されます"></textarea><button onclick="cp()">コピー</button></div>
<div class="card"><b>表示</b><div class="g" style="margin-top:8px"><button onclick="document.documentElement.dataset.theme='light'">ライト</button><button onclick="document.documentElement.dataset.theme='dark'">ダーク</button></div></div>`}
async function saveSet(){const s=mem.settings,c=$('#s_city').value.trim();const a3=parseFloat($('#s_th3').value),a6=parseFloat($('#s_th6').value);if(a3>0)s.th3=a3;if(a6>0)s.th6=a6;s.meds=$('#s_meds').value.split('\n').map(x=>x.trim()).filter(Boolean);
if(c&&c!==s.city){try{const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(c)+'&count=1&language=ja'),j=await r.json();if(j.results&&j.results[0]){s.city=c;s.lat=j.results[0].latitude;s.lon=j.results[0].longitude}else{wxMsg='市が見つかりませんでした'}}catch(e){s.city=c;wxMsg='市の座標を取得できませんでした(通信できない環境の可能性があります)'}}
await save('settings');if(s.lat)await wx();draw()}
const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
function csv(t){let o;if(t==='h'){o=[['日時','気温','気圧','天気']].concat(Object.keys(mem.weather).sort().map(k=>[k,...mem.weather[k].slice(0,2),WC(mem.weather[k][2])]))}
else{o=[['日付','入眠','起床','睡眠時間h','中途覚醒','寝起き気分','入浴','夕食','残業h','1日の気分','食欲','頭痛最大','眠気最大','運動分','昼寝分','体温','気温0時','気温6時','気温12時','気温18時','気圧0時','気圧6時','気圧12時','気圧18時','気圧最高','気圧最低','天気12時','随時記録','メモ']];
rows().forEach(r=>{const x=mem.daily[r.d]||{},ev=evsOf(r.d),p=dayP(r.d),w=h=>hr(r.d,h);
o.push([r.d,x.sleepAt,x.wakeAt,sleepH(x)?.toFixed(2),x.awake==='1'?'あり':x.awake==='0'?'なし':'',x.mood,x.bath,x.dinner,x.overtime,x.dayMood,x.appetite,r.head,r.sleepy,r.f['運動(分)'],r.f['昼寝(分)'],ev.filter(e=>e.type==='temp').map(e=>e.time+' '+e.val).join(' / '),...[0,6,12,18].map(h=>w(h)?.[0]),...[0,6,12,18].map(h=>w(h)?.[1]),p.length?Math.max(...p):'',p.length?Math.min(...p):'',w(12)?WC(w(12)[2]):'',ev.map(e=>e.time+' '+T[e.type].n+' '+desc(e)).join(' / '),x.memo])})}
$('#csvbox').value=o.map(r=>r.map(q).join(',')).join('\n')}
function bk(){const s=mem.settings,o=[['kind','f1','f2','f3','f4','f5','f6','f7','f8','f9','f10','f11'],['setting',s.city||'',s.lat??'',s.lon??'',(s.meds||[]).join('|'),'2',s.th3??'',s.th6??'']];
Object.keys(mem.daily).sort().forEach(d=>{const x=mem.daily[d];o.push(['daily',d,x.sleepAt,x.wakeAt,x.awake,x.mood,x.bath,x.dinner,x.overtime,x.memo,x.dayMood,x.appetite])});
mem.events.forEach(e=>o.push(['event',e.id,e.date,e.time,e.type,e.level,e.dur,e.name,e.min,e.val]));
Object.keys(mem.weather).sort().forEach(k=>o.push(['weather',k,...mem.weather[k]]));
return o.map(r=>r.map(q).join(',')).join('\n')}
function dl(){const t=bk();$('#csvbox').value=t;try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='health-backup-'+today()+'.csv';document.body.appendChild(a);a.click();a.remove()}catch(e){}
$('#bk_msg').textContent='保存を実行しました。保存されない場合は、下のCSV枠の内容をコピーしてメモ等に貼り付けてください'}
function parseCSV(t){t=t.replace(/^\ufeff/,'');const R=[];let r=[],c='',iq=false;for(let i=0;i<t.length;i++){const ch=t[i];if(iq){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else iq=false}else c+=ch}else if(ch=='"')iq=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=ch}
if(c!==''||r.length){r.push(c);R.push(r)}return R}
const nv=v=>v===''||v==null?null:+v;
function pick(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#rsbox').value=r.result;$('#bk_msg').textContent='読み込みました。「復元」をタップしてください'};r.readAsText(f)}
async function rs(){const R=parseCSV($('#rsbox').value),n={daily:0,event:0,weather:0},s=mem.settings,ids=new Set(mem.events.map(e=>String(e.id)));
if(!R.some(r=>['daily','event','weather','setting'].includes(r[0]))){$('#bk_msg').textContent='復元できるデータが見つかりません(バックアップCSVを指定してください)';return}
const sr=R.find(r=>r[0]==='setting'),legacy=!sr||sr[5]!=='2',cv=v=>legacy&&v!=null?Math.ceil(v/2):v;
R.forEach(r=>{const k=r[0];
if(k==='setting'){if(r[1])s.city=r[1];if(r[2]!=='')s.lat=+r[2];if(r[3]!=='')s.lon=+r[3];if(r[4])s.meds=r[4].split('|').filter(Boolean);if(r[6]!==''&&r[6]!=null)s.th3=+r[6];if(r[7]!==''&&r[7]!=null)s.th6=+r[7]}
else if(k==='daily'&&r[1]){mem.daily[r[1]]={sleepAt:r[2],wakeAt:r[3],awake:r[4],mood:r[5],bath:r[6],dinner:r[7],overtime:nv(r[8]),memo:r[9],dayMood:r[10]||'',appetite:r[11]||''};n.daily++}
else if(k==='event'&&r[1]&&!ids.has(r[1])){mem.events.push({id:+r[1],date:r[2],time:r[3],type:r[4],level:r[4]==='headache'?cv(nv(r[5])):nv(r[5]),dur:nv(r[6]),name:r[7],min:nv(r[8]),val:nv(r[9])});ids.add(r[1]);n.event++}
else if(k==='weather'&&(r[1]||'').includes('T')){mem.weather[r[1]]=[nv(r[2]),nv(r[3]),nv(r[4])];n.weather++}});
for(const k of ['daily','events','weather','settings'])await save(k);
bkMsg=`復元しました(日別${n.daily}件、随時記録${n.event}件、気象${n.weather}件)`;draw()}
async function cp(){const b=$('#csvbox');b.select();try{await navigator.clipboard.writeText(b.value)}catch(e){document.execCommand('copy')}}
(async()=>{await ld();for(const k of Object.keys(mem)){const v=await kv(k);if(v)mem[k]=v}mem.settings.meds=mem.settings.meds||[];if(db&&!(await kv('hv5'))){mem.events.forEach(e=>{if(e.type==='headache'&&e.level!=null)e.level=Math.ceil(e.level/2)});await save('events');await kv('hv5',1)}draw();if(mem.settings.lat){await wx();if(tab==='set')draw()}})();
</script></body></html>
